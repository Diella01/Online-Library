<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="Reg.css">
</head>
<body>
    <div class="box">
        <h3>Register</h3>

        <!-- Role Selection -->
        <div class="role-selection">
            <label>
                <input type="radio" name="role" value="user" checked> User
            </label>
            <label>
                <input type="radio" name="role" value="admin"> Administrator
            </label>
        </div>

        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Name and Surname">

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Email">

        <label for="birthdate">Birthdate:</label>
        <input type="text" id="birthdate" placeholder="MM/DD/YYYY">

        <label>Gender:</label>
        <div class="gender-group">
            <input type="radio" id="female" name="gender">
            <label for="female">F</label>
            <input type="radio" id="male" name="gender">
            <label for="male">M</label>
        </div>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" placeholder="Phone Number">

        <label for="city">City:</label>
        <input type="text" id="city" placeholder="City">

        <div>
            <input type="checkbox" id="terms">
            <label for="terms">I accept Terms and Conditions</label>
        </div>

        <div class="button-center">
            <a href="books.html" class="btn-register">Register</a>
        </div>
    </div>
</body>
</html>
